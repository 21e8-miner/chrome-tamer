<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #050508;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00d9ff;
      --accent-glow: rgba(0, 217, 255, 0.3);
      --text: #ffffff;
      --text-dim: #888899;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      padding: 18px;
      margin: 0;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #0077ff);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #000;
      font-size: 16px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .pressure-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .pressure-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .gauge-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      width: 100%;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d9ff, #ff00ff);
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .stat-card:hover {
      border-color: var(--accent);
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .debug-panel {
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
    }

    .debug-title {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .tab-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .tab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .tab-icon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      color: #ccc;
    }

    .tab-score {
      font-family: monospace;
      font-weight: 700;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .footer {
      margin-top: 16px;
      font-size: 10px;
      color: #444455;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand">
      <div class="logo">T</div>
      <h1>Chrome Tamer</h1>
    </div>
    <div
      style="font-size: 9px; color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 4px; font-weight: 800;">
      AUTO</div>
  </div>

  <div class="pressure-container">
    <div class="pressure-label">
      <span>System Pressure</span>
      <span id="pressureVal">0%</span>
    </div>
    <div class="gauge-bg">
      <div class="gauge-fill" id="pressureGauge"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="savedMem">0<span style="font-size: 12px">MB</span></div>
      <div class="stat-label">RAM Freed</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="tamedTabs">0</div>
      <div class="stat-label">Tabs Tamed</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="focusModeBtn">
      <span>⚡ Activate Focus Engine</span>
    </button>
    <button class="btn btn-secondary" id="whitelistBtn">
      <span>🛡️ Exclude Current Domain</span>
    </button>
  </div>

  <div class="debug-panel">
    <div class="debug-title">Low Utility Candidates</div>
    <div id="debugList">
      <div style="font-size: 11px; color: #555;">Analyzing players...</div>
    </div>
  </div>

  <div class="footer">
    <div class="pulse"></div>
    <span>Engine Status: Pressure-Aware v2.3</span>
  </div>

  <script src="popup.js"></script>
</body>

</html>
